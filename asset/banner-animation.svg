<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Deep Minimal Dark Background -->
    <linearGradient id="bg-minimal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060709" />
      <stop offset="50%" stop-color="#0b0d12" />
      <stop offset="100%" stop-color="#040507" />
    </linearGradient>

    <!-- Crimson Accent Line Gradient -->
    <linearGradient id="red-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0d49" stop-opacity="0" />
      <stop offset="25%" stop-color="#ff0d49" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#ff0d49" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff0d49" stop-opacity="0" />
    </linearGradient>

    <!-- Metallic Urban Text Gradient -->
    <linearGradient id="urban-text" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1d5db" />
    </linearGradient>
  </defs>

  <style>
    /* ANIMATIONS */
    @keyframes title-pulse {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(255, 13, 73, 0.4)); }
      50% { filter: drop-shadow(0 0 16px rgba(255, 13, 73, 0.85)); }
    }

    /* Auto-Changing Subtitle Roles (12s Total Loop) */
    @keyframes text-role-1 {
      0%, 21% { opacity: 1; transform: translateY(0); }
      24%, 100% { opacity: 0; transform: translateY(6px); }
    }

    @keyframes text-role-2 {
      0%, 23% { opacity: 0; transform: translateY(-6px); }
      26%, 46% { opacity: 1; transform: translateY(0); }
      49%, 100% { opacity: 0; transform: translateY(6px); }
    }

    @keyframes text-role-3 {
      0%, 48% { opacity: 0; transform: translateY(-6px); }
      51%, 71% { opacity: 1; transform: translateY(0); }
      74%, 100% { opacity: 0; transform: translateY(6px); }
    }

    @keyframes text-role-4 {
      0%, 73% { opacity: 0; transform: translateY(-6px); }
      76%, 96% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(6px); }
    }

    .animated-title { animation: title-pulse 3.5s ease-in-out infinite; }

    .role-1 { animation: text-role-1 12s infinite; }
    .role-2 { animation: text-role-2 12s infinite; }
    .role-3 { animation: text-role-3 12s infinite; }
    .role-4 { animation: text-role-4 12s infinite; }
  </style>

  <!-- Clean Minimalist Background Base -->
  <rect width="1200" height="400" fill="url(#bg-minimal)" />

  <!-- Subtle Framing Guide Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="1120" y1="0" x2="1120" y2="400" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Top Accent Line -->
  <line x1="250" y1="115" x2="950" y2="115" stroke="url(#red-line-grad)" stroke-width="1.5" />

  <!-- ================= CENTERPIECE URBAN CONTENT ================= -->

  <!-- BOLD URBAN TITLE (100% GitHub Compatible) -->
  <g transform="translate(600, 205)">
    <!-- Red Drop Glow / Shadow Layer -->
    <text x="-3" y="3" fill="#ff0d49" class="animated-title" font-family="Impact, 'Arial Black', sans-serif" font-size="82" font-weight="900" letter-spacing="4" text-anchor="middle">
      MD-RAIYAN
    </text>

    <!-- Main White Metallic Text Layer -->
    <text x="0" y="0" fill="url(#urban-text)" font-family="Impact, 'Arial Black', sans-serif" font-size="82" font-weight="900" letter-spacing="4" text-anchor="middle">
      MD-RAIYAN
    </text>
  </g>

  <!-- AUTO-CHANGING URBAN SUBTITLE -->
  <g transform="translate(600, 260)">
    <!-- Minimalist Tag Pill -->
    <rect x="-185" y="-18" width="370" height="34" rx="4" fill="#0b0d12" stroke="#ff0d49" stroke-opacity="0.5" stroke-width="1.2" />

    <g font-family="Consolas, 'Courier New', Monaco, monospace" font-size="14" font-weight="700" text-anchor="middle">
      <!-- Role 1 -->
      <text x="0" y="4" fill="#ff0d49" class="role-1">[ CYBERSECURITY STUDENT ]</text>
      
      <!-- Role 2 -->
      <text x="0" y="4" fill="#ff3b00" class="role-2">[ PENETRATION TESTER ]</text>
      
      <!-- Role 3 -->
      <text x="0" y="4" fill="#ffffff" class="role-3">[ SECURITY RESEARCHER ]</text>
      
      <!-- Role 4 -->
      <text x="0" y="4" fill="#ff0d49" class="role-4">[ RED TEAM OPERATOR ]</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="250" y1="288" x2="950" y2="288" stroke="url(#red-line-grad)" stroke-width="1.5" />

  <!-- Minimal Decorative Corner Marks -->
  <g fill="#ff0d49" opacity="0.4" font-family="Consolas, monospace" font-size="10">
    <text x="35" y="35">+</text>
    <text x="1155" y="35">+</text>
    <text x="35" y="375">+</text>
    <text x="1155" y="375">+</text>
  </g>

</svg>
