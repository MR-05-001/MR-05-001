<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="YOUR_NAME — Cybersecurity Student">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="60%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#160003"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="1200" height="200" rx="10"/>
    </clipPath>
  </defs>

  <rect width="1200" height="200" rx="10" fill="url(#bg)"/>

  <g clip-path="url(#clip)">

    <rect x="0" y="0" width="1200" height="2" fill="#8b0018" opacity="0.75"/>
    <rect x="0" y="198" width="1200" height="2" fill="#8b0018" opacity="0.75"/>

    <text x="600" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="0.2" fill="#f5f5f5" opacity="0">
      YOUR_NAME
      <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="1s" calcMode="spline" keySplines="0.25 0.1 0.25 1" fill="freeze"/>
      <animate attributeName="y" from="104" to="90" begin="0.15s" dur="1s" calcMode="spline" keySplines="0.25 0.1 0.25 1" fill="freeze"/>
    </text>

    <rect x="600" y="110" width="0" height="2" rx="1" fill="#b8001f" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.4s" fill="freeze"/>
      <animate attributeName="x" from="600" to="530" begin="1.1s" dur="0.6s" calcMode="spline" keySplines="0.25 0.1 0.25 1" fill="freeze"/>
      <animate attributeName="width" from="0" to="140" begin="1.1s" dur="0.6s" calcMode="spline" keySplines="0.25 0.1 0.25 1" fill="freeze"/>
    </rect>

    <text x="600" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" letter-spacing="0.2" fill="#9a9a9a" opacity="0">
      Cybersecurity Student · Aspiring Penetration Tester
      <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.8s" fill="freeze"/>
    </text>

  </g>
</svg>
