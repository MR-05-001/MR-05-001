<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="300"
  viewBox="0 0 1200 300"
  role="img"
  aria-label="MR-05-001 Cybersecurity Banner"
>

  <defs>

    <!-- ===================================================== -->
    <!-- BACKGROUND -->
    <!-- ===================================================== -->

    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030303"/>
      <stop offset="45%" stop-color="#090909"/>
      <stop offset="75%" stop-color="#170000"/>
      <stop offset="100%" stop-color="#300005"/>
    </linearGradient>

    <!-- ===================================================== -->
    <!-- RED ACCENT -->
    <!-- ===================================================== -->

    <linearGradient id="redLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a0000"/>
      <stop offset="25%" stop-color="#ff0033"/>
      <stop offset="50%" stop-color="#ff3355"/>
      <stop offset="75%" stop-color="#ff0033"/>
      <stop offset="100%" stop-color="#5a0000"/>
    </linearGradient>

    <!-- ===================================================== -->
    <!-- GLOW -->
    <!-- ===================================================== -->

    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <!-- ===================================================== -->
    <!-- GRID -->
    <!-- ===================================================== -->

    <pattern
      id="grid"
      width="30"
      height="30"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M 30 0 L 0 0 0 30"
        fill="none"
        stroke="#ff0033"
        stroke-width="0.5"
        opacity="0.10"
      />
    </pattern>

    <!-- ===================================================== -->
    <!-- SCANLINES -->
    <!-- ===================================================== -->

    <pattern
      id="scanlines"
      width="4"
      height="8"
      patternUnits="userSpaceOnUse"
    >
      <rect
        width="4"
        height="1"
        fill="#ffffff"
        opacity="0.025"
      />
    </pattern>

    <!-- ===================================================== -->
    <!-- CLIP -->
    <!-- ===================================================== -->

    <clipPath id="bannerClip">
      <rect
        x="0"
        y="0"
        width="1200"
        height="300"
        rx="16"
      />
    </clipPath>

  </defs>


  <!-- ======================================================= -->
  <!-- MAIN BACKGROUND -->
  <!-- ======================================================= -->

  <rect
    width="1200"
    height="300"
    rx="16"
    fill="url(#background)"
  />

  <!-- subtle red glow in background -->

  <ellipse
    cx="600"
    cy="155"
    rx="360"
    ry="130"
    fill="#ff0033"
    opacity="0.055"
    filter="url(#softGlow)"
  />


  <!-- ======================================================= -->
  <!-- CONTENT CLIP -->
  <!-- ======================================================= -->

  <g clip-path="url(#bannerClip)">

    <!-- GRID -->

    <rect
      width="1200"
      height="300"
      fill="url(#grid)"
    />

    <!-- SCANLINES -->

    <rect
      width="1200"
      height="300"
      fill="url(#scanlines)"
    />


    <!-- ===================================================== -->
    <!-- TOP TECHNICAL BAR -->
    <!-- ===================================================== -->

    <rect
      x="0"
      y="0"
      width="1200"
      height="3"
      fill="url(#redLine)"
    />

    <rect
      x="0"
      y="297"
      width="1200"
      height="3"
      fill="url(#redLine)"
    />


    <!-- ===================================================== -->
    <!-- LEFT DECORATIVE CIRCUIT -->
    <!-- ===================================================== -->

    <g
      fill="none"
      stroke="#ff0033"
      stroke-width="1.2"
      opacity="0.55"
    >

      <path d="M 55 70 H 150 V 105 H 185"/>

      <path d="M 55 105 H 110 V 140 H 165"/>

      <path d="M 55 235 H 135 V 200 H 175"/>

      <path d="M 55 265 H 95 V 235 H 150"/>

    </g>


    <!-- circuit nodes -->

    <g
      fill="#ff0033"
      filter="url(#redGlow)"
    >

      <circle cx="55" cy="70" r="3"/>
      <circle cx="55" cy="105" r="3"/>
      <circle cx="55" cy="235" r="3"/>
      <circle cx="55" cy="265" r="3"/>

      <circle cx="185" cy="105" r="3"/>
      <circle cx="165" cy="140" r="3"/>
      <circle cx="175" cy="200" r="3"/>
      <circle cx="150" cy="235" r="3"/>

    </g>


    <!-- ===================================================== -->
    <!-- RIGHT DECORATIVE CIRCUIT -->
    <!-- ===================================================== -->

    <g
      fill="none"
      stroke="#ff0033"
      stroke-width="1.2"
      opacity="0.55"
    >

      <path d="M 1145 70 H 1050 V 105 H 1015"/>

      <path d="M 1145 105 H 1090 V 140 H 1035"/>

      <path d="M 1145 235 H 1065 V 200 H 1025"/>

      <path d="M 1145 265 H 1105 V 235 H 1050"/>

    </g>

    <g
      fill="#ff0033"
      filter="url(#redGlow)"
    >

      <circle cx="1145" cy="70" r="3"/>
      <circle cx="1145" cy="105" r="3"/>
      <circle cx="1145" cy="235" r="3"/>
      <circle cx="1145" cy="265" r="3"/>

      <circle cx="1015" cy="105" r="3"/>
      <circle cx="1035" cy="140" r="3"/>
      <circle cx="1025" cy="200" r="3"/>
      <circle cx="1050" cy="235" r="3"/>

    </g>


    <!-- ===================================================== -->
    <!-- TOP STATUS -->
    <!-- ===================================================== -->

    <g
      font-family="Fira Code, Consolas, monospace"
      font-size="11"
      fill="#ff3355"
      letter-spacing="2"
    >

      <text x="55" y="34">
        SYS::ONLINE
      </text>

      <text x="1145" y="34" text-anchor="end">
        SECURE_CHANNEL
      </text>

    </g>


    <!-- ===================================================== -->
    <!-- MAIN TITLE GLOW -->
    <!-- ===================================================== -->

    <text
      x="600"
      y="132"
      text-anchor="middle"
      font-family="Orbitron, Arial, sans-serif"
      font-size="58"
      font-weight="800"
      letter-spacing="7"
      fill="#ff0033"
      opacity="0.28"
      filter="url(#redGlow)"
    >
      MR-05-001
    </text>


    <!-- ===================================================== -->
    <!-- MAIN TITLE -->
    <!-- ===================================================== -->

    <text
      x="600"
      y="132"
      text-anchor="middle"
      font-family="Orbitron, Arial, sans-serif"
      font-size="58"
      font-weight="800"
      letter-spacing="7"
      fill="#f4f4f4"
    >
      MR-05-001
    </text>


    <!-- ===================================================== -->
    <!-- UNDERLINE -->
    <!-- ===================================================== -->

    <rect
      x="455"
      y="151"
      width="290"
      height="2"
      rx="1"
      fill="#ff0033"
      filter="url(#redGlow)"
    />

    <!-- small animated pulse -->

    <rect
      x="455"
      y="151"
      width="45"
      height="2"
      rx="1"
      fill="#ffffff"
    >
      <animate
        attributeName="x"
        values="455;700;455"
        dur="3.5s"
        repeatCount="indefinite"
      />
    </rect>


    <!-- ===================================================== -->
    <!-- SUBTITLE -->
    <!-- ===================================================== -->

    <text
      x="600"
      y="184"
      text-anchor="middle"
      font-family="Rajdhani, Arial, sans-serif"
      font-size="20"
      font-weight="600"
      letter-spacing="3"
      fill="#d8d8d8"
    >
      CYBERSECURITY • OFFENSIVE SECURITY • RESEARCH
    </text>


    <!-- ===================================================== -->
    <!-- TERMINAL LINE -->
    <!-- ===================================================== -->

    <g
      font-family="Fira Code, Consolas, monospace"
      font-size="13"
      letter-spacing="1"
    >

      <text
        x="600"
        y="220"
        text-anchor="middle"
        fill="#8f8f8f"
      >
        root@kali:~#
      </text>

      <text
        x="686"
        y="220"
        fill="#ff0033"
      >
        ./init_security.sh
      </text>

    </g>


    <!-- ===================================================== -->
    <!-- STATUS INDICATORS -->
    <!-- ===================================================== -->

    <g
      font-family="Fira Code, Consolas, monospace"
      font-size="10"
      letter-spacing="1.5"
    >

      <!-- left -->

      <circle
        cx="450"
        cy="250"
        r="3"
        fill="#ff0033"
      >
        <animate
          attributeName="opacity"
          values="1;0.25;1"
          dur="1.8s"
          repeatCount="indefinite"
        />
      </circle>

      <text
        x="462"
        y="254"
        fill="#888888"
      >
        OFFENSIVE_SECURITY
      </text>


      <!-- center -->

      <circle
        cx="600"
        cy="250"
        r="3"
        fill="#ff0033"
      >
        <animate
          attributeName="opacity"
          values="0.25;1;0.25"
          dur="1.8s"
          repeatCount="indefinite"
        />
      </circle>

      <text
        x="612"
        y="254"
        fill="#888888"
      >
        SYSTEM_READY
      </text>


      <!-- right -->

      <circle
        cx="753"
        cy="250"
        r="3"
        fill="#ff0033"
      >
        <animate
          attributeName="opacity"
          values="1;0.25;1"
          dur="1.8s"
          repeatCount="indefinite"
        />
      </circle>

      <text
        x="765"
        y="254"
        fill="#888888"
      >
        TARGET: KNOWLEDGE
      </text>

    </g>


    <!-- ===================================================== -->
    <!-- SCAN SWEEP -->
    <!-- ===================================================== -->

    <rect
      x="0"
      y="-15"
      width="1200"
      height="2"
      fill="#ff0033"
      opacity="0.35"
    >
      <animate
        attributeName="y"
        from="-15"
        to="315"
        dur="5s"
        repeatCount="indefinite"
      />
    </rect>


    <!-- ===================================================== -->
    <!-- CORNER MARKERS -->
    <!-- ===================================================== -->

    <g
      stroke="#ff0033"
      stroke-width="2"
      fill="none"
      opacity="0.85"
    >

      <!-- top left -->
      <path d="M 25 55 V 25 H 55"/>

      <!-- top right -->
      <path d="M 1175 55 V 25 H 1145"/>

      <!-- bottom left -->
      <path d="M 25 245 V 275 H 55"/>

      <!-- bottom right -->
      <path d="M 1175 245 V 275 H 1145"/>

    </g>

  </g>

</svg>
